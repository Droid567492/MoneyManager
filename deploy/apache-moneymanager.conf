<VirtualHost *:80>
    ServerName your-domain.duckdns.org
    ServerAlias localhost 127.0.0.1

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^your-domain\.duckdns\.org(:80)?$ [NC]
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://your-domain.duckdns.org%{REQUEST_URI} [R=301,L]

    RedirectMatch 301 ^/moneymanager$ /moneymanager/

    ProxyPreserveHost On
    ProxyRequests Off
    <Location /moneymanager/>
        RequestHeader set X-Forwarded-Proto "http"
    </Location>
    LimitRequestBody 67108864

    ProxyPass /moneymanager/ http://127.0.0.1:3000/
    ProxyPassReverse /moneymanager/ http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/moneymanager_error.log
    CustomLog ${APACHE_LOG_DIR}/moneymanager_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName your-domain.duckdns.org
    ServerAlias localhost 127.0.0.1

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/your-domain.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-domain.duckdns.org/privkey.pem

    RedirectMatch 301 ^/moneymanager$ /moneymanager/

    ProxyPreserveHost On
    ProxyRequests Off
    <Location /moneymanager/>
        RequestHeader set X-Forwarded-Proto "https"
    </Location>
    LimitRequestBody 67108864

    ProxyPass /moneymanager/ http://127.0.0.1:3000/
    ProxyPassReverse /moneymanager/ http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/moneymanager_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/moneymanager_ssl_access.log combined
</VirtualHost>
</IfModule>
