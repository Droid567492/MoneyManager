name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check source and frontend JavaScript
        run: |
          for f in src/*.js public/js/*.js public/sw.js test/*.js; do
            node --check "$f"
          done

      - name: Run automated test suite
        run: npm test
